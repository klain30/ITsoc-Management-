# Production-style stack. Copy .env.prod.example to .env.prod, fill it in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Open APP_URL (default http://localhost:8080). Only the web container is published;
# it serves the SPA and proxies /api to the API, which in turn is the only client of the database.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: itsoc_management
      POSTGRES_USER: itsoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsoc -d itsoc_management"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API can reach the database.

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://itsoc:${POSTGRES_PASSWORD}@db:5432/itsoc_management?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      CORS_ORIGINS: ${APP_URL:?set APP_URL}
      APP_URL: ${APP_URL}
      TRUST_PROXY: "1"
      LOG_LEVEL: info
      BOOTSTRAP_PRESIDENT_EMAIL: ${BOOTSTRAP_PRESIDENT_EMAIL:-}
      BOOTSTRAP_PRESIDENT_FIRST_NAME: ${BOOTSTRAP_PRESIDENT_FIRST_NAME:-}
      BOOTSTRAP_PRESIDENT_LAST_NAME: ${BOOTSTRAP_PRESIDENT_LAST_NAME:-}
      BOOTSTRAP_PRESIDENT_STUDENT_ID: ${BOOTSTRAP_PRESIDENT_STUDENT_ID:-}
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  db_data:
  uploads:
